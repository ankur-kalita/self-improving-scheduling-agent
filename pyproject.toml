[project]
name = "clinic-agent"
version = "0.1.0"
description = "Patient-appointment scheduling agent with a self-improving evaluation loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chat = "clinic_agent.chat:main"
eval = "clinic_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_agent", "src/clinic_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
